name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, internal-names]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ARTIFACT_REF: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}

jobs:
  setup-tests:
    name: Setup tests
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RUST_VERSION: 1.97.1
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link

    steps:
      - name: Keep line endings as committed
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Tools
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target x86_64-pc-windows-msvc
          rustup default "$RUST_VERSION"
          cargo --version

      - name: Setup core tests
        run: cd installer && cargo test --locked --target x86_64-pc-windows-msvc -p unyxedshell-setup-core

      - name: Setup UI tests
        run: node --test installer/ui-tests/request-coordinator.test.js

  build:
    name: Build x64
    runs-on: windows-2025
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      QT_VERSION: 6.11.2
      RUST_VERSION: 1.97.1
      AQTINSTALL_COMMIT: 076e1659807d0b362a3ed684d54c2e9c775eb9c7
      FONTTOOLS_VERSION: 4.67.0
      MATUGEN_VERSION: 4.1.0
      CLI11_TAG: v2.5.0
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link

    steps:
      - name: Keep line endings as committed
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v4

      - name: Paths
        run: |
          tmp="$(cygpath -m "$RUNNER_TEMP")"
          {
            echo "QT_ROOT=$tmp/qt"
            echo "QT_WIN=$tmp/qt/$QT_VERSION/msvc2022_64"
            echo "CLI11_DIR=$tmp/cli11"
            echo "PYTHON=python"
          } >> "$GITHUB_ENV"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools
        run: |
          python -m pip install --quiet "aqtinstall @ git+https://github.com/miurahr/aqtinstall@$AQTINSTALL_COMMIT" "fonttools==$FONTTOOLS_VERSION" ninja
          rustup toolchain install "$RUST_VERSION" --profile minimal --target x86_64-pc-windows-msvc
          rustup default "$RUST_VERSION"
          clang-cl --version
          cmake --version
          ninja --version
          cargo --version

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qt
          key: qt-${{ env.QT_VERSION }}-msvc2022_64-qt5compat-qtimageformats-qtpositioning-qtshadertools

      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: aqt install-qt windows desktop "$QT_VERSION" win64_msvc2022_64 -m qt5compat qtimageformats qtpositioning qtshadertools -O "$QT_ROOT"

      - name: CLI11
        run: git clone -q --depth 1 --branch "$CLI11_TAG" https://github.com/CLIUtils/CLI11.git "$CLI11_DIR"

      - name: Build the engine
        run: |
          cmake -S engine -B build/qs -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl \
            -DCMAKE_PREFIX_PATH="$QT_WIN" -DCLI11_INCLUDE_DIR="$CLI11_DIR/include" \
            -DQS_PRODUCT_NAME=unyxedshell -DQS_COMPANY_NAME=unyxedshell -DQS_VERSION_FILE="$(cygpath -m "$PWD/VERSION")"
          cmake --build build/qs

      - name: Build the setup
        run: cd installer && cargo build --release --locked --target x86_64-pc-windows-msvc -p unyxedshell-setup

      - name: Build matugen
        run: cargo install matugen --version "$MATUGEN_VERSION" --locked --root build/matugen

      - name: Build SongRec
        run: NATIVE=1 tools/songrec/build.sh

      - name: Build MicroTeX
        run: NATIVE=1 tools/microtex/build.sh

      - name: Visual C++ runtime
        run: |
          crt="$(ls -d "$(cygpath -u "$VCToolsRedistDir")"/x64/Microsoft.VC14*.CRT | tail -n1)"
          echo "runtime from $crt"
          mkdir -p build/vcredist
          for f in msvcp140.dll msvcp140_1.dll msvcp140_2.dll msvcp140_atomic_wait.dll vcruntime140.dll vcruntime140_1.dll; do
            cp -f "$crt/$f" build/vcredist/
          done

      - name: Package
        env:
          FONTTOOLS: python -m fontTools
          MATUGEN_EXE: build/matugen/bin/matugen.exe
          VCREDIST_DIR: build/vcredist
          SKIP_SETUP_BUILD: "1"
        run: |
          export QMLCACHEGEN="$QT_WIN/bin/qmlcachegen.exe"
          tools/deploy-shell.sh
          tools/release.sh
          (cd dist/release && sha256sum unyxedshell-setup.exe unyxedshell-*.zip)

      - uses: actions/upload-artifact@v4
        with:
          name: unyxedshell-${{ env.ARTIFACT_REF }}-${{ github.run_number }}
          path: dist/release/
          if-no-files-found: error
